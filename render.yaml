# This file tells Render how to deploy your services.
# It defines a backend service and a frontend service,
# both built from Dockerfiles in your repository.

services:
  # The Java Backend Service
  - type: web
    name: stockcheck-backend
    # Use the Docker environment
    env: docker
    # Specify the subdirectory for this service
    rootDir: ./backend
    dockerfilePath: ./Dockerfile
    # Use Render's free instance type
    plan: free
    # Health Check to ensure the service is responsive before it's considered "healthy"
    healthCheck:
      path: /api/categories
      initialDelaySeconds: 120
    # Define the environment variables the backend needs
    envVars:
      - key: JDBC_DATABASE_URL
        fromDatabase:
          name: stockcheck-db
          property: connectionURI
      - key: JDBC_DATABASE_USER
        fromDatabase:
          name: stockcheck-db
          property: user
      - key: JDBC_DATABASE_PASSWORD
        fromDatabase:
          name: stockcheck-db
          property: password

  # The React Frontend Service (served with Nginx)
  - type: web
    name: stockcheck-frontend
    env: docker
    rootDir: ./frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # This is the crucial variable for our Nginx template.
      # It points to the internal address Render creates for the backend service.
      - key: BACKEND_URL
        fromService:
          name: stockcheck-backend
          type: web
          property: url

databases:
  - name: stockcheck-db
    plan: free
